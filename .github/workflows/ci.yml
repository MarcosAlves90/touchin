name: CI

on:
  push:
  pull_request:

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: pip install -r requirements.txt

      - name: Run backend tests
        run: pytest

  frontend-tests:
    name: Frontend tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install frontend dependencies
        run: flutter pub get

      - name: Run frontend tests
        run: flutter test

      - name: Set up Node.js for browser smoke
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Set up Chrome for browser smoke
        id: chrome
        uses: browser-actions/setup-chrome@v2

      - name: Build Flutter Web and run visual smoke from POLIS policy
        working-directory: .
        env:
          TOUCHIN_CHROME: ${{ steps.chrome.outputs.chrome-path }}
          # Ubuntu Actions restricts Chrome's user-namespace sandbox; limit the
          # opt-out to this isolated, headless CI browser smoke process.
          TOUCHIN_CHROME_NO_SANDBOX: '1'
        run: python3 scripts/run_polis_gates.py build smoke

name: CI

on:
  push:
  pull_request:

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: pip install -r requirements.txt

      - name: Run backend tests
        run: pytest

  frontend-tests:
    name: Frontend tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install frontend dependencies
        run: flutter pub get

      - name: Run frontend tests
        run: flutter test

      - name: Test POLIS CI gate runner
        working-directory: .
        run: python3 -B -m unittest discover -s scripts/tests -v

      - name: Set up Go for POLIS CLI
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.0'

      - name: Install POLIS CLI v6.12.0
        working-directory: .
        run: go install github.com/MarcosAlves90/polis/v6/cmd/polis@v6.12.0

      - name: Set up Node.js for browser smoke
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Validate POLIS policy and plan
        working-directory: .
        run: |
          "$(go env GOPATH)/bin/polis" doctor --repo .
          "$(go env GOPATH)/bin/polis" plan --repo .

      - name: Analyze full Flutter source and tests with POLIS
        working-directory: .
        run: "$(go env GOPATH)/bin/polis" gates --repo . --gate lint

      - name: Set up Chrome for browser smoke
        id: chrome
        uses: browser-actions/setup-chrome@v2

      - name: Build Flutter Web and run visual smoke with POLIS CLI
        working-directory: .
        env:
          TOUCHIN_CHROME: ${{ steps.chrome.outputs.chrome-path }}
          # Ubuntu Actions restricts Chrome's user-namespace sandbox; limit the
          # opt-out to this isolated, headless CI browser smoke process.
          TOUCHIN_CHROME_NO_SANDBOX: '1'
        run: "$(go env GOPATH)/bin/polis" gates --repo . --gate build --gate smoke

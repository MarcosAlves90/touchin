name: Android release

on:
  push:
    branches:
      - 'release/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android-release:
    name: Build and publish Android release
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The default also includes the retired SDK package "tools".
          packages: platform-tools
          log-accepted-android-sdk-licenses: false

      - name: Install frontend dependencies
        run: flutter pub get

      - name: Validate release metadata
        run: dart run scripts/release_info.dart validate

      - name: Export release metadata
        run: dart run scripts/release_info.dart github-env >> "$GITHUB_ENV"

      - name: Fail if release tag already exists
        run: |
          git fetch --tags --force
          if git rev-parse "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Tag $RELEASE_TAG already exists. Bump frontend/pubspec.yaml before publishing."
            exit 1
          fi

      - name: Validate Android signing secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_PASSWORD ANDROID_KEY_ALIAS; do
            if [ -z "${!name}" ]; then
              echo "Missing required secret: $name"
              exit 1
            fi
          done

      - name: Configure Android signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/release-keystore.jks
          {
            echo "storePassword=$ANDROID_KEYSTORE_PASSWORD"
            echo "keyPassword=$ANDROID_KEY_PASSWORD"
            echo "keyAlias=$ANDROID_KEY_ALIAS"
            echo "storeFile=../release-keystore.jks"
          } > android/key.properties

      - name: Verify frontend defaults to production
        run: flutter test --no-pub test/developer_preview_entry_test.dart

      - name: Run frontend tests
        run: flutter test --no-pub --concurrency=1 --exclude-tags canonical-golden --dart-define=TOUCHIN_FRONTEND_DEV_MODE=true

      - name: Build Android App Bundle
        run: flutter build appbundle --release --dart-define=API_BASE_URL=https://self-bunchin-app.onrender.com/api/v1

      - name: Build Android APK
        run: flutter build apk --release --dart-define=API_BASE_URL=https://self-bunchin-app.onrender.com/api/v1

      - name: Verify Android release artifacts
        run: |
          set -euo pipefail
          test -f build/app/outputs/bundle/release/app-release.aab
          test -f build/app/outputs/flutter-apk/app-release.apk
          AAPT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)/aapt"
          "$AAPT" dump badging build/app/outputs/flutter-apk/app-release.apk | grep "package: name='com.bunchin.app'"
          "$AAPT" dump badging build/app/outputs/flutter-apk/app-release.apk | grep "application-label:'Bunchin'"
          "$AAPT" dump badging build/app/outputs/flutter-apk/app-release.apk | grep "versionCode='$RELEASE_BUILD_NUMBER'"
          "$AAPT" dump badging build/app/outputs/flutter-apk/app-release.apk | grep "versionName='$RELEASE_VERSION'"
          "$AAPT" dump badging build/app/outputs/flutter-apk/app-release.apk | grep "uses-permission: name='android.permission.INTERNET'"
          "$AAPT" dump badging build/app/outputs/flutter-apk/app-release.apk | grep "uses-permission: name='android.permission.ACCESS_COARSE_LOCATION'"
          "$AAPT" dump badging build/app/outputs/flutter-apk/app-release.apk | grep "uses-permission: name='android.permission.ACCESS_FINE_LOCATION'"
          unzip -p build/app/outputs/flutter-apk/app-release.apk lib/arm64-v8a/libapp.so | strings | grep -F 'https://self-bunchin-app.onrender.com/api/v1'
          "$AAPT" dump badging build/app/outputs/flutter-apk/app-release.apk | grep "launchable-activity: name='com.bunchin.app.MainActivity'"
          jarsigner -verify build/app/outputs/bundle/release/app-release.aab | grep -F 'jar verified.'

      - name: Verify APK can update the previous release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APKSIGNER="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)/apksigner"
          previous_tag="$(git describe --tags --abbrev=0 --match 'v[0-9]*' HEAD)"
          previous_dir="$(mktemp -d)"
          gh release download "$previous_tag" --pattern app-release.apk --dir "$previous_dir"
          signer() {
            "$APKSIGNER" verify --print-certs "$1" | awk '/certificate SHA-256 digest:/ {print $NF}' | sort
          }
          previous_signer="$(signer "$previous_dir/app-release.apk")"
          current_signer="$(signer build/app/outputs/flutter-apk/app-release.apk)"
          test -n "$previous_signer"
          test "$previous_signer" = "$current_signer" || {
            echo "The APK signing certificate does not match the previous release."
            exit 1
          }

      - name: Create release tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$RELEASE_TAG" -m "$RELEASE_NAME"
          git push origin "$RELEASE_TAG"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          notes_file="release/notes/$RELEASE_TAG.md"
          if [[ -f "$notes_file" ]]; then
            release_notes_args=(--notes-file "$notes_file")
          else
            release_notes_args=(--notes "$RELEASE_NOTES")
          fi
          gh release create "$RELEASE_TAG" \
            build/app/outputs/bundle/release/app-release.aab \
            build/app/outputs/flutter-apk/app-release.apk \
            --title "$RELEASE_NAME" \
            "${release_notes_args[@]}" \
            --prerelease
